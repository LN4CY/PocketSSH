name: PocketSSH CI & Simulation Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Host Unit & Subsystem Tests
        run: python tests/test_runner.py

      - name: Build Firmware with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4
          target: esp32s3
          path: '.'

      - name: Run Wokwi Automated Integration Scenario
        if: env.WOKWI_CLI_TOKEN != ''
        uses: wokwi/wokwi-ci-action@v1
        with:
          token: ${{ secrets.WOKWI_CLI_TOKEN }}
          path: '.'
          scenario: 'tests/wokwi_scenario.yaml'
          timeout: 35000
          fail_text: 'Guru Meditation Error'

      - name: Notify Wokwi Token Status
        if: env.WOKWI_CLI_TOKEN == ''
        run: |
          echo "::notice ::Wokwi cloud simulation step skipped: WOKWI_CLI_TOKEN is not configured in repository secrets. To enable automated Wokwi simulation in CI, add your token in GitHub Repository Settings -> Secrets and variables -> Actions."
